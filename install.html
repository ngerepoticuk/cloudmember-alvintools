<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install AlvinTools</title>
  <script src="config.js?v=2026"></script>
  <style>
    :root {
      --brand: #dc2626;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --soft: #f8fafc;
      --danger: #e11d48;
      --ok: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f5f9;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 760px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.5rem, 3vw, 2rem);
      line-height: 1.15;
      letter-spacing: 0;
    }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    form { padding: 28px; display: grid; gap: 18px; }
    label { display: grid; gap: 8px; font-size: 0.85rem; font-weight: 800; color: #334155; }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 13px 14px;
      font: inherit;
      color: var(--ink);
      outline: none;
    }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0, 170, 231, 0.16);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .full { grid-column: 1 / -1; }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    button:disabled { opacity: .62; cursor: wait; }
    button.secondary {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid #cbd5e1;
    }
    .section-divider {
      margin: 0 28px;
      border: 0;
      border-top: 1px solid var(--line);
    }
    .section-note {
      padding: 20px 28px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .status {
      display: none;
      padding: 14px 16px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .status.ok { display: block; border-color: #bbf7d0; background: #f0fdf4; color: var(--ok); }
    .status.err { display: block; border-color: #fecdd3; background: #fff1f2; color: var(--danger); }
    .status.info { display: block; }
    .meta {
      padding: 14px 28px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: #64748b;
      font-size: 0.78rem;
      font-weight: 700;
    }
    @media (max-width: 640px) {
      body { padding: 12px; }
      header, form { padding: 20px; }
      .grid { grid-template-columns: 1fr; }
      .meta { padding: 12px 20px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Install AlvinTools</h1>
      <p>Aktifkan lisensi resmi AlvinTools agar website siap digunakan di domain ini.</p>
    </header>

    <form id="install-form">
      <div class="grid">
        <label class="full">
          URL Pusat Lisensi
          <input id="license-server" type="url" placeholder="https://pusat-lisensi-anda.com/" required>
        </label>
        <label>
          Kode Lisensi
          <input id="license-key" type="text" placeholder="ULD-XXXX-1234" autocomplete="off" required>
        </label>
        <label>
          Domain Ini
          <input id="domain" type="text" readonly>
        </label>
      </div>

      <button id="btn-install" type="submit">Aktivasi Lisensi</button>
      <div id="status" class="status"></div>
    </form>

    <hr class="section-divider">
    <p class="section-note">Pindah domain lisensi.</p>
    <form id="reset-domain-form">
      <div class="grid">
        <label class="full">
          URL Pusat Lisensi
          <input id="reset-license-server" type="url" placeholder="https://pusat-lisensi-anda.com/" required>
        </label>
        <label>
          Kode Lisensi
          <input id="reset-license-key" type="text" placeholder="ULD-XXXX-1234" autocomplete="off" required>
        </label>
        <label>
          Email Terdaftar
          <input id="reset-email" type="email" placeholder="email@domain.com" autocomplete="email" required>
        </label>
      </div>

      <button id="btn-reset-domain" class="secondary" type="submit">Reset Domain Lama</button>
      <div id="reset-status" class="status"></div>
    </form>

    <div class="meta">
      <span id="app-version">Versi: -</span>
      <span id="update-status">Update: belum dicek</span>
    </div>
  </main>

  <script>
    const form = document.getElementById('install-form');
    const statusBox = document.getElementById('status');
    const btn = document.getElementById('btn-install');
    const domainInput = document.getElementById('domain');
    const serverInput = document.getElementById('license-server');
    const resetForm = document.getElementById('reset-domain-form');
    const resetStatusBox = document.getElementById('reset-status');
    const resetBtn = document.getElementById('btn-reset-domain');
    const resetServerInput = document.getElementById('reset-license-server');
    const resetLicenseInput = document.getElementById('reset-license-key');
    const resetEmailInput = document.getElementById('reset-email');
    const versionText = document.getElementById('app-version');
    const updateText = document.getElementById('update-status');

    domainInput.value = window.location.hostname.replace(/^www\./, '');
    serverInput.value = 'https://sheetflare.net/';
    resetServerInput.value = serverInput.value;
    if (window.CLOUDMEMBER_APP) {
      versionText.innerText = 'Versi: ' + window.CLOUDMEMBER_APP.version;
    }

    function setStatus(type, message) {
      statusBox.className = 'status ' + type;
      statusBox.innerText = message;
    }

    function setResetStatus(type, message) {
      resetStatusBox.className = 'status ' + type;
      resetStatusBox.innerText = message;
    }

    async function postApi(payload) {
      const res = await fetch(window.SCRIPT_URL || window.location.origin + '/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    async function checkUpdate() {
      try {
        const r = await postApi({ action: 'check_master_update' });
        if (r.status !== 'success') {
          updateText.innerText = 'Update: URL pusat lisensi belum diatur';
          return;
        }
        updateText.innerText = r.update_available
          ? 'Update: tersedia ' + r.latest_version
          : 'Update: versi terbaru';
      } catch (e) {
        updateText.innerText = 'Update: belum tersedia';
      }
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      btn.disabled = true;
      btn.innerText = 'Memproses...';
      setStatus('info', 'Memvalidasi lisensi AlvinTools...');

      try {
        const r = await postApi({
          action: 'activate_client_license',
          license_server_url: serverInput.value.trim(),
          license_key: document.getElementById('license-key').value.trim(),
          domain: domainInput.value.trim()
        });

        if (r.status === 'success') {
          setStatus('ok', r.message || 'Lisensi aktif.');
          await checkUpdate();
        } else {
          setStatus('err', r.message || 'Aktivasi gagal.');
        }
      } catch (e) {
        setStatus('err', 'Tidak bisa terhubung ke pusat lisensi. Periksa URL aktivasi dan koneksi.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Aktivasi Lisensi';
      }
    });

    resetForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      resetBtn.disabled = true;
      resetBtn.innerText = 'Memproses...';
      setResetStatus('info', 'Memverifikasi lisensi dan email terdaftar...');

      try {
        const licenseServer = resetServerInput.value.trim();
        const licenseKey = resetLicenseInput.value.trim();
        const email = resetEmailInput.value.trim();
        const r = await postApi({
          action: 'self_reset_client_domain',
          license_server_url: licenseServer,
          license_key: licenseKey,
          email
        });

        if (r.status === 'success') {
          serverInput.value = licenseServer;
          document.getElementById('license-key').value = licenseKey;
          setResetStatus('ok', r.message || 'Domain lama berhasil direset.');
          setStatus('info', 'Domain lama sudah direset. Klik Aktivasi Lisensi untuk mengunci lisensi ke domain ini.');
        } else {
          setResetStatus('err', r.message || 'Reset domain gagal.');
        }
      } catch (e) {
        setResetStatus('err', 'Tidak bisa terhubung ke pusat lisensi. Periksa URL aktivasi dan koneksi.');
      } finally {
        resetBtn.disabled = false;
        resetBtn.innerText = 'Reset Domain Lama';
      }
    });

    checkUpdate();
  </script>
</body>
</html>
